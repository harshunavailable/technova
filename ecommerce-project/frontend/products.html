<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Technova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="container page-title-block">
  <h1 id="page-heading">All Products</h1>
  <p id="page-sub">Browse the full catalog and filter down to exactly what you need.</p>
</div>

<section class="section-tight">
  <div class="container">
    <div class="filter-bar">
      <div class="search-wrap">
        <input type="text" id="f-search" placeholder="Search products, brands…">
      </div>
      <select id="f-category"><option value="">All categories</option></select>
      <select id="f-sort">
        <option value="newest">Newest</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="rating">Top rated</option>
      </select>
      <button class="btn btn-sm" id="f-apply">Apply</button>
    </div>

    <div id="results-meta" style="margin-bottom:16px; color:var(--ink-soft); font-size:.9rem;"></div>
    <div class="product-grid" id="product-grid"><div class="loading-row">Loading products…</div></div>

    <div style="display:flex; justify-content:center; gap:10px; margin-top:32px;" id="pagination"></div>
  </div>
</section>

<div id="footer"></div>

<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script>
const params = new URLSearchParams(location.search);
let state = {
  section: params.get('section') || '',
  category: params.get('category') || '',
  search: '',
  sort: 'newest',
  page: 1,
  pageSize: 12
};

document.addEventListener('DOMContentLoaded', async () => {
  renderNavbar(state.section === 'PC' ? 'pc' : state.section === 'CCTV' ? 'cctv' : '');
  renderFooter();

  const heading = document.getElementById('page-heading');
  const sub = document.getElementById('page-sub');
  if (state.section === 'PC') { heading.textContent = 'PC Components'; sub.textContent = 'Processors, boards, RAM, GPUs, storage, PSUs, cabinets and monitors.'; }
  if (state.section === 'CCTV') { heading.textContent = 'CCTV & Security'; sub.textContent = 'Cameras, recorders, cabling and accessories for any space.'; }

  await loadCategoryOptions();
  await runSearch();

  document.getElementById('f-apply').addEventListener('click', () => {
    state.search = document.getElementById('f-search').value.trim();
    state.category = document.getElementById('f-category').value;
    state.sort = document.getElementById('f-sort').value;
    state.page = 1;
    runSearch();
  });
  document.getElementById('f-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('f-apply').click();
  });
});

async function loadCategoryOptions() {
  const sel = document.getElementById('f-category');
  try {
    const cats = await api.get(`/categories${state.section ? `?section=${state.section}` : ''}`);
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.CategoryID; opt.textContent = c.Name;
      if (String(c.CategoryID) === state.category) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch (_) { /* categories are optional for filtering */ }
}

async function runSearch() {
  const grid = document.getElementById('product-grid');
  const meta = document.getElementById('results-meta');
  grid.innerHTML = `<div class="loading-row">Loading products…</div>`;
  try {
    const qs = new URLSearchParams();
    if (state.section) qs.set('section', state.section);
    if (state.category) qs.set('category', state.category);
    if (state.search) qs.set('search', state.search);
    if (state.sort) qs.set('sort', state.sort);
    qs.set('page', state.page); qs.set('pageSize', state.pageSize);

    const data = await api.get(`/products?${qs.toString()}`);
    meta.textContent = `${data.total} result${data.total === 1 ? '' : 's'}`;
    grid.innerHTML = data.items.length
      ? data.items.map(productCard).join('')
      : `<div class="empty-state"><h3>No products matched</h3><p>Try a different search or clear your filters.</p></div>`;

    renderPagination(data.total);
  } catch (err) {
    grid.innerHTML = `<div class="empty-state"><h3>Couldn't load products</h3><p>${err.message}</p></div>`;
  }
}

function renderPagination(total) {
  const pages = Math.ceil(total / state.pageSize);
  const el = document.getElementById('pagination');
  if (pages <= 1) { el.innerHTML = ''; return; }
  let html = '';
  for (let i = 1; i <= pages; i++) {
    html += `<button class="btn btn-sm ${i === state.page ? 'btn-primary' : 'btn-ghost'}" onclick="goToPage(${i})">${i}</button>`;
  }
  el.innerHTML = html;
}
function goToPage(p) { state.page = p; runSearch(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
</script>
</body>
</html>
