<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Technova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="container page-title-block">
  <h1>My Orders</h1>
  <p>Track past purchases and re-download any invoice.</p>
</div>

<section class="section-tight">
  <div class="container" id="orders-list"><div class="loading-row">Loading your orders…</div></div>
</section>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/invoice.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  renderNavbar('orders');
  renderFooter();
  const el = document.getElementById('orders-list');

  if (!isLoggedIn()) {
    el.innerHTML = `<div class="empty-state"><h3>Log in to see your orders</h3><a href="login.html" class="btn btn-primary" style="margin-top:14px;">Log in</a></div>`;
    return;
  }

  try {
    const orders = await api.get('/orders', true);
    if (orders.length === 0) {
      el.innerHTML = `<div class="empty-state"><h3>No orders yet</h3><p>Once you check out, your orders will show up here.</p><a href="products.html" class="btn btn-primary" style="margin-top:14px;">Start shopping</a></div>`;
      return;
    }
    el.innerHTML = orders.map(o => `
      <div class="product-card" style="flex-direction:row; align-items:center; padding:18px 20px; gap:20px; margin-bottom:14px;">
        <div style="flex:1;">
          <strong>Order #${o.OrderID}</strong>
          <div style="color:var(--ink-soft); font-size:.85rem; margin-top:4px;">${new Date(o.OrderDate).toLocaleString()}</div>
        </div>
        <span class="status-pill ${o.Status}">${o.Status}</span>
        <div style="font-weight:700; width:110px; text-align:right;">${formatINR(o.TotalAmount)}</div>
        <button class="btn btn-sm" onclick="downloadOrderInvoice(${o.OrderID}, this)">⬇ Invoice</button>
      </div>`).join('');
  } catch (err) {
    el.innerHTML = `<div class="empty-state"><h3>Couldn't load orders</h3><p>${err.message}</p></div>`;
  }
});

async function downloadOrderInvoice(orderId, btn) {
  btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const data = await api.get(`/orders/${orderId}`, true);
    downloadInvoice(data);
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = '⬇ Invoice';
  }
}
</script>
</body>
</html>
