<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Own PC — Technova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="container page-title-block">
  <h1>Build Your Own PC</h1>
  <p>Pick a part for each slot below. We check sockets, RAM type, case fit and PSU wattage automatically, so nothing you build can be incompatible.</p>
</div>

<section class="section-tight">
  <div class="container builder-layout">
    <div class="builder-steps" id="builder-steps"></div>

    <aside class="build-summary">
      <h3>Your build</h3>
      <div id="summary-issues"></div>
      <div id="summary-lines"></div>
      <div class="total-row"><span>Total</span><span id="summary-total">₹0</span></div>
      <button class="btn btn-primary btn-block" id="add-build-btn" disabled>Add full build to cart</button>
      <button class="btn btn-ghost btn-block" id="save-build-btn" style="margin-top:10px;" disabled>Save this build</button>
      <p class="field-hint" style="margin-top:10px;">Pick at least a processor, motherboard and RAM to add your build to the cart.</p>
    </aside>
  </div>
</section>

<div class="picker-modal-backdrop" id="picker-backdrop">
  <div class="picker-modal">
    <div class="picker-head">
      <h3 id="picker-title">Choose a component</h3>
      <button class="btn btn-sm btn-ghost" id="picker-close">Close</button>
    </div>
    <div class="picker-list" id="picker-list"></div>
  </div>
</div>

<div id="footer"></div>

<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/pcbuilder.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => { renderNavbar('builder'); renderFooter(); initBuilder(); });
</script>
</body>
</html>
