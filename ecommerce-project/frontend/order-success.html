<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Technova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<section class="section-tight">
  <div class="container" style="max-width:720px;">
    <div id="success-content"><div class="loading-row">Loading your order…</div></div>
  </div>
</section>

<div id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/invoice.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  renderNavbar();
  renderFooter();

  const orderId = new URLSearchParams(location.search).get('id');
  const el = document.getElementById('success-content');

  if (!isLoggedIn() || !orderId) {
    el.innerHTML = `<div class="empty-state"><h3>Order not found</h3></div>`;
    return;
  }

  try {
    const data = await api.get(`/orders/${orderId}`, true);
    window.__orderData = data;
    el.innerHTML = `
      <div style="text-align:center; padding:20px 0 36px;">
        <div style="width:76px;height:76px;border-radius:50%;background:var(--volt);border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#10131C" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>
        </div>
        <h1>Order confirmed</h1>
        <p>Order #${data.order.OrderID} · placed ${new Date(data.order.OrderDate).toLocaleString()}</p>
      </div>

      <div class="summary-card" style="position:static;">
        <h3>What you ordered</h3>
        ${data.items.map(i => `<div class="summary-line"><span>${i.ProductName} × ${i.Quantity}</span><span>${formatINR(i.LineTotal)}</span></div>`).join('')}
        <div class="summary-line" style="margin-top:10px;"><span>Subtotal</span><span>${formatINR(data.order.Subtotal)}</span></div>
        <div class="summary-line"><span>Tax</span><span>${formatINR(data.order.Tax)}</span></div>
        <div class="summary-line"><span>Shipping</span><span>${data.order.ShippingFee === 0 ? 'Free' : formatINR(data.order.ShippingFee)}</span></div>
        <div class="summary-total"><span>Total paid</span><span>${formatINR(data.order.TotalAmount)}</span></div>

        <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:22px;">
          <button class="btn btn-primary" onclick="downloadInvoice(window.__orderData)">⬇ Download PDF invoice</button>
          <a href="orders.html" class="btn btn-ghost">View all orders</a>
          <a href="products.html" class="btn btn-ghost">Continue shopping</a>
        </div>
      </div>`;
  } catch (err) {
    el.innerHTML = `<div class="empty-state"><h3>Couldn't load order</h3><p>${err.message}</p></div>`;
  }
});
</script>
</body>
</html>
