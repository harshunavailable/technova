<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Technova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="container page-title-block">
  <h1>Your Cart</h1>
  <p>Review your items before checkout.</p>
</div>

<section class="section-tight">
  <div class="container cart-layout">
    <div id="cart-items"><div class="loading-row">Loading your cart…</div></div>

    <aside class="summary-card">
      <h3>Order Summary</h3>
      <div class="summary-line"><span>Subtotal</span><span id="sum-subtotal">₹0</span></div>
      <div class="summary-line"><span>Estimated tax (18%)</span><span id="sum-tax">₹0</span></div>
      <div class="summary-line"><span>Shipping</span><span id="sum-shipping">₹0</span></div>
      <div class="summary-total"><span>Total</span><span id="sum-total">₹0</span></div>
      <button class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:18px;">Proceed to checkout</button>
      <p class="field-hint">Free shipping automatically applied over ₹5,000.</p>
    </aside>
  </div>
</section>

<div id="footer"></div>

<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => { renderNavbar(); renderFooter(); loadCart(); });
</script>
</body>
</html>
