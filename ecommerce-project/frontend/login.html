<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Technova</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 style="font-size:1.6rem;">Welcome back</h1>
    <p style="margin-bottom:24px;">Log in to build, buy and track your orders.</p>
    <form id="login-form">
      <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" required></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
    </form>
    <div class="auth-switch">New here? <a href="register.html">Create an account</a></div>
  </div>
</div>

<div id="footer"></div>

<script src="js/components.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => { renderNavbar(); renderFooter(); initLoginForm(); });
</script>
</body>
</html>
